# Produktivseite www.tennis-eglosheim.de bei AllInkl.
# Läuft nur auf Knopfdruck: Actions → "Produktiv veröffentlichen" → Run workflow (Branch main).
# Baut die Seite und lädt den Inhalt von dist/ per FTPS (FTP mit TLS, Port 21) in das
# Home-Verzeichnis des Upload-Users (= /www-neu/).
# Hochgeladen werden nur Dateien, deren Inhalt sich geändert hat (Vergleich per SHA-256
# mit der Liste .deploy-manifest.txt vom letzten Upload). Gelöscht werden nur Dateien,
# die dieser Workflow selbst hochgeladen hat, sowie veraltete generierte Dateien in
# _astro/. kontakt-config.php wird nie angefasst. Details: .github/scripts/produktiv-upload.sh
#
# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   FTP_HOST      Servername bei AllInkl, z. B. w0123456.kasserver.com
#   FTP_USER      FTP-Benutzer mit Home = /www-neu/
#   FTP_PASSWORD  Passwort dieses Benutzers
name: Produktiv veröffentlichen

on:
  workflow_dispatch:
    inputs:
      alles_hochladen:
        description: "Alle Dateien neu hochladen (statt nur geänderte)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: produktiv
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload per FTPS (nur geänderte Dateien)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ALLES_HOCHLADEN: ${{ inputs.alles_hochladen }}
        run: bash .github/scripts/produktiv-upload.sh dist
